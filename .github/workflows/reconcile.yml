name: Reconcile Stale Jobs

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run reconciliation sweep
        run: npx tsx Worker/reconcile.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          privatekey: ${{ secrets.PRIVATEKEY }}
          APP_ID: ${{ secrets.APP_ID }}
